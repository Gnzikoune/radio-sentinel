<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radio Sentinel - Relais GPS Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus_Jakarta_Sans', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-6 antialiased">

    <!-- Top Header -->
    <header class="text-center pt-2">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 mb-3 shadow-lg shadow-cyan-500/10">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </div>
        <h1 class="text-xl font-bold tracking-tight">Relais GPS Mobile</h1>
        <p class="text-xs text-slate-400 mt-0.5">Transmission Satellite pour Radio Sentinel</p>
    </header>

    <!-- Main Live Stats Box -->
    <main class="my-auto space-y-4">

        <!-- Status Card -->
        <div class="p-5 rounded-2xl bg-slate-900 border border-slate-800 text-center">
            <div id="status-pill" class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30 mb-4">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span id="status-text">En attente d'activation</span>
            </div>

            <div class="grid grid-cols-2 gap-3 text-left">
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800/80">
                    <span class="text-[10px] text-slate-500 font-mono uppercase">Latitude</span>
                    <p id="val-lat" class="text-sm font-mono font-bold text-cyan-400 truncate mt-1">--</p>
                </div>
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800/80">
                    <span class="text-[10px] text-slate-500 font-mono uppercase">Longitude</span>
                    <p id="val-lon" class="text-sm font-mono font-bold text-cyan-400 truncate mt-1">--</p>
                </div>
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800/80">
                    <span class="text-[10px] text-slate-500 font-mono uppercase">Précision</span>
                    <p id="val-acc" class="text-sm font-mono font-bold text-slate-200 mt-1">--</p>
                </div>
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800/80">
                    <span class="text-[10px] text-slate-500 font-mono uppercase">Vitesse</span>
                    <p id="val-speed" class="text-sm font-mono font-bold text-slate-200 mt-1">--</p>
                </div>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between text-xs text-slate-400 font-mono">
                <span>Paquets envoyés :</span>
                <span id="val-packets" class="text-cyan-400 font-bold">0</span>
            </div>
        </div>

        <!-- Action Button -->
        <button id="toggle-btn" class="w-full py-4 rounded-xl bg-cyan-600 hover:bg-cyan-500 active:scale-[0.98] text-white font-bold text-sm tracking-wide transition shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Démarrer la Transmission GPS
        </button>

    </main>

    <!-- Footer info -->
    <footer class="text-center text-[11px] text-slate-500 pb-2">
        <p>Gardez cet onglet ouvert pour continuer la transmission des coordonnées au PC.</p>
    </footer>

    <script>
        let watchId = null;
        let packetCount = 0;
        let isRunning = false;
        let wakeLock = null;

        const toggleBtn = document.getElementById('toggle-btn');
        const statusPill = document.getElementById('status-pill');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const valLat = document.getElementById('val-lat');
        const valLon = document.getElementById('val-lon');
        const valAcc = document.getElementById('val-acc');
        const valSpeed = document.getElementById('val-speed');
        const valPackets = document.getElementById('val-packets');

        // Prevent screen sleep
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log('WakeLock non supporté ou refusé:', err);
            }
        }

        async function sendGPS(pos) {
            const coords = pos.coords;
            valLat.textContent = coords.latitude.toFixed(6);
            valLon.textContent = coords.longitude.toFixed(6);
            valAcc.textContent = coords.accuracy ? `±${Math.round(coords.accuracy)}m` : '--';
            valSpeed.textContent = coords.speed ? `${Math.round(coords.speed * 3.6)} km/h` : '0 km/h';

            try {
                const res = await fetch('/api/gps', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        latitude: coords.latitude,
                        longitude: coords.longitude,
                        accuracy: coords.accuracy,
                        speed: coords.speed ? coords.speed * 3.6 : 0,
                        altitude: coords.altitude
                    })
                });
                if (res.ok) {
                    packetCount++;
                    valPackets.textContent = packetCount;
                }
            } catch (err) {
                console.error('Erreur transmission GPS au PC:', err);
            }
        }

        function startGPS() {
            if (!navigator.geolocation) {
                alert("La géolocalisation n'est pas supportée par votre navigateur.");
                return;
            }

            requestWakeLock();

            statusText.textContent = "Acquisition Satellite en direct";
            statusPill.className = "inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 mb-4";
            statusDot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
            toggleBtn.className = "w-full py-4 rounded-xl bg-rose-600 hover:bg-rose-500 active:scale-[0.98] text-white font-bold text-sm tracking-wide transition shadow-lg shadow-rose-500/20 flex items-center justify-center gap-2";
            toggleBtn.innerHTML = `
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Arrêter la Transmission
            `;

            watchId = navigator.geolocation.watchPosition(
                sendGPS,
                (err) => {
                    alert("Erreur GPS : " + err.message);
                    stopGPS();
                },
                { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 }
            );

            isRunning = true;
        }

        function stopGPS() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }

            statusText.textContent = "Transmission arrêtée";
            statusPill.className = "inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30 mb-4";
            statusDot.className = "w-2 h-2 rounded-full bg-amber-500";
            toggleBtn.className = "w-full py-4 rounded-xl bg-cyan-600 hover:bg-cyan-500 active:scale-[0.98] text-white font-bold text-sm tracking-wide transition shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2";
            toggleBtn.innerHTML = `
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Démarrer la Transmission GPS
            `;

            isRunning = false;
        }

        toggleBtn.addEventListener('click', () => {
            if (isRunning) stopGPS();
            else startGPS();
        });
    </script>
</body>
</html>
